moko-resource-compose = {group = "dev.icerock.moko", name = "resources-compose", version.ref = "moko-version"}
moko-mvvm = { module = "dev.icerock.moko:mvvm-compose", version.ref = "moko-mvvm" }
moko-permission = { module = "dev.icerock.moko:permissions", version.ref = "moko-permission" }
moko-permission-compose = { module = "dev.icerock.moko:permissions-compose", version.ref = "moko-permission" }
moko-permission-test = { module = "dev.icerock.moko:permissions-test", version.ref = "moko-permission" }

voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-screen-model = { module = "cafe.adriel.voyager:voyager-screenmodel", version.ref = "voyager" }
